name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the rosetta from the IEPD schema
        run: npm run build:rosetta

      - name: Load the bundled FJC sample (PGlite)
        run: npm run load:fjc -- data/sample/cpbank_fy2025_sample.tsv

      - name: Run end-to-end tests over MCP stdio
        run: npm test
